{% extends "base.html" %}
{% block title %}Publicar una receta{% endblock %}
{% block content %}
<section class="form-page recipe-form-page">
  <span class="eyebrow"><span class="eyebrow-line"></span> ALGO BUENO SE COCINA</span>
  <h1>Comparte tu<br><em>receta.</em></h1>
  <p class="form-intro">Ese plato que siempre te piden merece un lugar en la mesa.</p>
  <form class="recipe-form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="title">Nombre de la receta</label>
    <input id="title" name="title" required maxlength="100" placeholder="Ej. La pasta del domingo" value="{{ request.form.get('title', '') }}">
    <label for="description">Cuéntanos un poco <span class="optional">(opcional)</span></label>
    <textarea id="description" name="description" rows="3" maxlength="2000" placeholder="¿Qué la hace especial?">{{ request.form.get('description', '') }}</textarea>
    <label for="ingredients">Ingredientes</label>
    <textarea id="ingredients" name="ingredients" rows="5" required placeholder="Un ingrediente por línea&#10;Ej.&#10;2 tomates maduros&#10;1 cucharada de aceite de oliva">{{ request.form.get('ingredients', '') }}</textarea>
    <span class="field-hint">Escríbelos uno por línea o sepáralos con comas. Hasta 50 ingredientes.</span>
    <button class="primary-button" type="submit">Publicar receta <span>→</span></button>
  </form>
</section>
{% endblock %}
