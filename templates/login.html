{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<section class="form-page">
  <span class="eyebrow"><span class="eyebrow-line"></span> QUÉ BUENO VERTE</span>
  <h1>Volvamos a<br><em>la mesa.</em></h1>
  <p class="form-intro">Inicia sesión para compartir tus recetas favoritas.</p>
  <form class="recipe-form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Nombre de usuario</label>
    <input id="username" name="username" autocomplete="username" required maxlength="30" value="{{ request.form.get('username', '') }}">
    <label for="password">Contraseña</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <button class="primary-button" type="submit">Iniciar sesión <span>→</span></button>
  </form>
  <p class="form-switch">¿Aún no tienes cuenta? <a href="{{ url_for('register') }}">Regístrate</a></p>
</section>
{% endblock %}
